name: CD - Frontend Deploy to S3 + CloudFront

# 目的: フロントエンドを S3 にデプロイ + CloudFront キャッシュ無効化。
# CI と分離し、明示的トリガーのみで動く。
# トリガー:
#   - workflow_dispatch（手動）  : メイン
#   - tag push (release/v*)     : リリースタグ付与でデプロイ

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '本番デプロイ確認用に "deploy" と入力してください'
        required: true
        type: string
  push:
    tags:
      - 'release/v*'

env:
  AWS_REGION: ap-northeast-1

permissions:
  contents: read

# 同時実行を直列化する。並行 deploy が s3 sync --delete + CloudFront 無効化で競合し、
# index.html が存在しないチャンクを参照して 404(MIME text/html) になる事故を防ぐ。
concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm input (workflow_dispatch only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "ERROR: confirm に 'deploy' と入力されていません。中止します。"
            exit 1
          fi

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [guard]
    if: always() && (github.event_name == 'push' || needs.guard.result == 'success')
    # 本番反映ジョブは production Environment に紐付け、required reviewers の承認待ちで止める。
    environment: production
    defaults:
      run:
        working-directory: ./frontend

    env:
      # 公開 URL(公開 JS に焼き込まれる値)は Secret にする必要がないため直接記載する。
      # frestyle.jp 移行(FRESTYLE-225)で Secrets 更新に依存しない構成に変更。
      VITE_API_BASE_URL: https://api.frestyle.jp
      VITE_REDIRECT_URI: https://frestyle.jp/login/callback
      # ログイン画面(Cognito ホスト UI)のホスト。auth.normanblog.com から移設(FRESTYLE-226)。
      VITE_COGNITO_DOMAIN: auth.frestyle.jp
      VITE_WEB_SOCKET_URL_AI_CHAT: ${{ secrets.VITE_WEB_SOCKET_URL_AI_CHAT }}
      VITE_WEB_SOCKET_URL_CHAT: ${{ secrets.VITE_WEB_SOCKET_URL_CHAT }}
      VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
      VITE_RESPONSE_TYPE: ${{ secrets.VITE_RESPONSE_TYPE }}
      VITE_SCOPE: ${{ secrets.VITE_SCOPE }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 公開ページを Playwright(headless Chromium)でプリレンダーし、dist/index.html に
      # 中身入り HTML を焼き込む。検索ボットの初回取得で本文がクロールできるようにする
      # (CSR の空シェル対策 / FRESTYLE-222)。prerender スクリプトは空シェル/本文欠落を
      # 検知すると fail するため、壊れた場合は deploy されない(回帰ガード)。
      - name: Prerender public pages
        run: |
          npx playwright install --with-deps chromium
          npm run prerender

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 1) ハッシュ付きアセットは内容不変なので immutable + 長期キャッシュで配信する。
      #    index.html は別ステップで no-cache にするため、ここでは除外する。
      - name: Sync hashed assets to S3 (immutable, long cache)
        run: |
          aws s3 sync dist/ s3://fre-style-bucket --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "app.html"

      # 2) index.html は no-cache。これがないと古い index.html がブラウザにキャッシュされ、
      #    次デプロイの --delete で消えた旧チャンクを参照して 404(MIME text/html)になる。
      # index.html はトップ用(プリレンダー済み)、app.html は SPA フォールバック用(空シェル)。
      # どちらも no-cache。古い HTML がキャッシュされると、--delete で消えた旧チャンクを
      # 参照して 404(MIME text/html)になる。
      - name: Upload HTML entrypoints (no-cache)
        run: |
          for f in index.html app.html; do
            aws s3 cp "dist/$f" "s3://fre-style-bucket/$f" \
              --cache-control "no-cache, must-revalidate" \
              --content-type "text/html; charset=utf-8"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

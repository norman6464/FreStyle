name: CD - Frontend Deploy to S3 + CloudFront

# 目的: フロントエンドを S3 にデプロイ + CloudFront キャッシュ無効化。
# CI と分離し、明示的トリガーのみで動く。
# トリガー:
#   - workflow_dispatch（手動）  : メイン
#   - tag push (release/v*)     : リリースタグ付与でデプロイ

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '本番デプロイ確認用に "deploy" と入力してください'
        required: true
        type: string
      auth_mode:
        description: 'ログインを止めたまま出すなら unconfigured。既定は configured（設定が欠けていたら止まる）'
        required: false
        default: configured
        type: choice
        options: [configured, unconfigured]
  push:
    tags:
      - 'release/v*'

env:
  AWS_REGION: ap-northeast-1
  # GitHub OIDC で引き受けるデプロイ用ロール(FRESTYLE-89)。長寿命の静的キーは廃止。
  # 権限は配信バケットへのアップロードと CloudFront のキャッシュ無効化のみ。
  # 定義: frestyle-infrastructure の terraform/github-oidc-frontend.tf
  AWS_ROLE_ARN: arn:aws:iam::010928196665:role/frestyle-prod-github-actions-frontend-role

permissions:
  contents: read

# 同時実行を直列化する。並行 deploy が s3 sync --delete + CloudFront 無効化で競合し、
# index.html が存在しないチャンクを参照して 404(MIME text/html) になる事故を防ぐ。
concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm input (workflow_dispatch only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "ERROR: confirm に 'deploy' と入力されていません。中止します。"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [guard]
    if: always() && (github.event_name == 'push' || needs.guard.result == 'success')
    # pnpm install --frozen-lockfile / build は第三者のコードを実行するため、この job には AWS を触れる
    # 権限を与えない。id-token: write を持たせると、侵害された依存パッケージが
    # ACTIONS_ID_TOKEN_REQUEST_* 経由でトークンを発行し本番ロールを assume できてしまう。
    # contents: read は actions/checkout がソースを取得するためだけに必要(FRESTYLE-89)。
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    env:
      # 公開 URL(公開 JS に焼き込まれる値)は Secret にする必要がないため直接記載する。
      #
      # NOTE: 認証は OIDC へ移したが、**本番の発行者はまだ立てていない**。
      # ここの Secrets（発行者のホストとクライアント ID）を用意するまで、
      # 本番のフロントを出してもログインは通らない。出す前に発行者を先に決めること。
      VITE_API_BASE_URL: https://api.frestyle.jp
      VITE_OIDC_REDIRECT_URI: https://frestyle.jp/login/callback
      VITE_OIDC_AUTHORIZE_URI: ${{ secrets.VITE_OIDC_AUTHORIZE_URI }}
      VITE_OIDC_CLIENT_ID: ${{ secrets.VITE_OIDC_CLIENT_ID }}
      # openid だけだと id_token に名前もメールも載らず、offline_access が無いと
      # 更新用のトークンがそもそも発行されない。
      VITE_OIDC_SCOPE: openid profile email offline_access

    steps:
      - uses: actions/checkout@v6

      # 認可の設定と宣言（auth_mode）が噛み合っているかを確かめる。
      # 分岐の中身は .github/scripts/check-auth-config.sh にあり、正例・負例
      # 7 通りを ci-frontend.yml が毎回試している（ここに直接書くと、書いた時に
      # 1 度手で試して終わりになる）。
      #
      # tag push は inputs を持てないので auth_mode は既定の configured になる。
      # つまりタグで出すときは必ず設定が要る（黙って停止版が出ることはない）。
      - name: 認可の設定と宣言が噛み合っているか確かめる
        env:
          AUTH_MODE: ${{ inputs.auth_mode || 'configured' }}
          SITE_ORIGIN: https://frestyle.jp
        # build job は working-directory が ./frontend なので絶対パスで指す。
        run: "${{ github.workspace }}/.github/scripts/check-auth-config.sh"

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build は dist/app.html も作る（scripts/make-app-shell.mjs）。CloudFront は存在しない
      # パスへのリクエストにこのファイルを返すので、欠けると SPA の全ルートが壊れる。
      - name: Build
        run: pnpm run build

      # 公開ページのプリレンダーは廃止した（公開ランディングごと無くなり、焼き込む対象が
      # 無くなったため）。app.html の生成だけが必要で、それは build に移してある。
      - name: Verify SPA fallback shell
        run: test -f dist/app.html

      # deploy job へはビルド成果物だけを渡す。deploy 側は checkout しないため、
      # 本番ロールを持つ job にリポジトリのソースやスクリプトが存在しない。
      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    # 本番反映ジョブは production Environment に紐付け、required reviewers の承認待ちで止める。
    environment: production
    # OIDC トークンの発行に必要(FRESTYLE-89)。第三者コードを実行しないこの job にだけ与える。
    # checkout しないので contents は付けない。同一 run の artifact 取得に GITHUB_TOKEN の
    # 権限は要らない(別 run / 別リポから取るときだけ actions:read 付きの token が要る)。
    # permissions を明示した時点で、ここに書いていない権限はすべて none になる。
    permissions:
      id-token: write

    steps:
      - name: Download built assets
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      # 静的キーではなく OIDC でその実行だけ有効な一時認証情報を得る(FRESTYLE-89)。
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1) ハッシュ付きアセットは内容不変なので immutable + 長期キャッシュで配信する。
      #    index.html は別ステップで no-cache にするため、ここでは除外する。
      - name: Sync hashed assets to S3 (immutable, long cache)
        run: |
          aws s3 sync dist/ s3://fre-style-bucket --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "app.html"

      # 2) index.html は no-cache。これがないと古い index.html がブラウザにキャッシュされ、
      #    次デプロイの --delete で消えた旧チャンクを参照して 404(MIME text/html)になる。
      # index.html は既定のルートオブジェクト、app.html は SPA フォールバック用。公開
      # ランディングの焼き込みを廃止したので、どちらも同じ空シェル。
      # どちらも no-cache。古い HTML がキャッシュされると、--delete で消えた旧チャンクを
      # 参照して 404(MIME text/html)になる。
      - name: Upload HTML entrypoints (no-cache)
        run: |
          for f in index.html app.html; do
            aws s3 cp "dist/$f" "s3://fre-style-bucket/$f" \
              --cache-control "no-cache, must-revalidate" \
              --content-type "text/html; charset=utf-8"
          done

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # 無効化は打っただけでは終わっていない。完了を待たずに次へ進むと、
      # 直後の確認がエッジの古い応答を見て「通った」ことになる。
      #
      # この待ちには cloudfront:GetInvalidation が要る（CreateInvalidation だけでは
      # 足りない）。デプロイロールの権限は private リポの Terraform 側が持つ。
      - name: 無効化の完了を待つ
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "${{ steps.invalidate.outputs.id }}"

      # **バケットではなく、配信された実物を見る。**
      # S3 を読み戻しても「エッジが何を返すか」は 1 ミリも分からない。
      # バケットは正しいのにエッジが古い HTML を返している、という一番切り分けに
      # くい壊れ方は、この差でしか捕まらない。
      - name: 配信された実物を確かめる
        env:
          AUTH_MODE: ${{ inputs.auth_mode || 'configured' }}
        run: |
          url="https://frestyle.jp/"
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' --max-time 30 "$url")
          if [ "$code" != "200" ]; then
            echo "::error::${url} が ${code} を返しました"
            exit 1
          fi

          # SPA の入口として最低限これが無いと、何も描画されない。
          if ! grep -q 'id="root"' /tmp/index.html; then
            echo "::error::配信された HTML に描画先が見つかりません"
            exit 1
          fi

          # **200 が返ることは「今出したものが配られている」ことを意味しない。**
          # エッジが古い HTML を返していても 200 で、描画先も入っている。
          # いま出した成果物の資産名（内容ハッシュ付き）を、配信された HTML が
          # 指しているかまで見る。1 つでも欠けていれば、届いているのは前の版。
          missing_assets=""
          for asset in $(grep -o 'assets/[A-Za-z0-9._-]*\.js' dist/index.html | sort -u); do
            grep -q "${asset}" /tmp/index.html || missing_assets="${missing_assets} ${asset}"
          done
          if [ -n "${missing_assets}" ]; then
            echo "::error::配信された HTML が今回の資産を指していません（欠け:${missing_assets}）。エッジに古い版が残っています"
            exit 1
          fi

          # 入口が指す JS を 1 本引いて、実際に取得できることまで確かめる。
          # HTML だけ新しくて資産が配られていない、という壊れ方を捕まえる。
          entry=$(grep -o 'assets/[A-Za-z0-9._-]*\.js' /tmp/index.html | head -1)
          entry_code=$(curl -sS -o /tmp/entry.js -w '%{http_code}' --max-time 30 "https://frestyle.jp/${entry}")
          if [ "${entry_code}" != "200" ]; then
            echo "::error::${entry} が ${entry_code} を返しました"
            exit 1
          fi

          echo "配信を確認しました（${url} → ${code} / ${entry} → ${entry_code}）"
          {
            echo "### 配信の確認"
            echo "- \`${url}\` → ${code}"
            echo "- 今回の資産をすべて指している"
            echo "- \`${entry}\` → ${entry_code}"
            echo "- ログイン: $([ "${AUTH_MODE}" = "unconfigured" ] && echo "停止" || echo "有効")"
          } >> "$GITHUB_STEP_SUMMARY"

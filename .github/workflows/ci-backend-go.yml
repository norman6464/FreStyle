name: CI - Backend (Go)

# path フィルタは付けない: 必須ステータスチェック（branch protection）として使うため、
# 対象外パスの PR でも必ず report されるよう全 PR / main push で走らせる。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: vet / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: go mod download
        run: go mod download

      # go.mod / go.sum が tidy か検証する（未使用依存・取りこぼしを CI で検知）。
      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod/go.sum is not tidy. Run 'go mod tidy' in backend/ and commit."
            git diff go.mod go.sum
            exit 1
          fi

      # gofumpt 未整形のコードがあれば失敗させる。
      # gofmt は構文整形のみだが gofumpt はその上位互換で、空行・連続宣言の整列・
      # 不要な括弧改行など「人が迷う整形」も機械的に統一する。Effective Go の
      # "gofmt'd code is the standard" を一段強く CI で強制する入り口チェック。
      # `gofumpt -l .` が 1 ファイルでも出したら fail にし、ローカル `make fmt`
      # (= gofumpt -w) で直してもらう運用にする。生成コードは gofumpt clean のため除外不要。
      - name: gofumpt check
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          unformatted=$("$(go env GOPATH)/bin/gofumpt" -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofumpt-formatted:"
            echo "$unformatted"
            echo "Run 'make fmt' (gofumpt -w) in backend/ locally and commit the result."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint(v2) で複数 linter を一括実行する。default の
      # staticcheck / errcheck / govet / ineffassign / unused に加え、
      # errorlint(errors.Is/As・%w 強制) / bodyclose(HTTP body リーク) /
      # gosec(セキュリティ) / misspell / unconvert を有効化。設定は backend/.golangci.yml。
      # 従来の単体 staticcheck step を置き換える(staticcheck は golangci に内包)。
      # 解析対象の build tag は backend/.golangci.yml の run.build-tags で指定する
      # (integration を含む)。ここに args で足すとローカルの `golangci-lint run` と
      # CI で見る集合がずれ、「ローカルでは出るが CI では出ない」を再発させるため。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

      # govulncheck は Go 公式の脆弱性スキャナ。実際に呼んでいるコードパスに該当する
      # 既知 CVE だけを報告する。stdlib の CVE は Go パッチ追随次第で頻出するため、
      # CI を止めずに「可視化」目的の非ブロッキング（continue-on-error）にする。
      # ブロッキングなセキュリティ検査は CodeQL (codeql.yml) が担う。
      - name: govulncheck (advisory)
        continue-on-error: true
        run: |
          set -o pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./... | tee /tmp/govuln.txt
          {
            echo "## govulncheck (advisory)"
            echo '```'
            tail -5 /tmp/govuln.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # race detector + カバレッジ計測。rate limiter / JWT キャッシュ等の並行コードの
      # データ競合を CI で検出する。
      #
      # ここは build tag 無し = 単体テストだけの計測で、これ単独では総カバレッジにならない。
      # 実 PostgreSQL が要るコード（repository のクエリ）は 1 行も通らないため、
      # 結合側の計測（integration ジョブ）と合算する。合算と floor 判定は coverage ジョブが行う。
      - name: go test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage-unit.out ./...

      # 単体側のプロファイルを coverage ジョブへ渡す。ジョブごとに runner（ファイルシステム）が
      # 別なので、ジョブをまたぐファイルの受け渡しは artifact 経由でしかできない。
      - name: Upload unit coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          # path はジョブの working-directory ではなくワークスペース起点で解決される。
          path: backend/coverage-unit.out
          if-no-files-found: error
          retention-days: 7

      # sqlc 生成物 (internal/adapter/persistence/sqlcgen/) がスキーマ・クエリと一致しているかを
      # 検証する。schema/*.sql は起動時に流す実 DDL そのものなので、列の型を変えたのに
      # `make sqlc` を忘れると「実スキーマと Go の型が食い違ったまま」マージされる。
      # sqlc の版は backend/Makefile の SQLC_VERSION 固定（生成物は版で差分が出るため
      # ここでは版を書かず Makefile を唯一の出どころにする）。
      - name: sqlc drift check
        run: |
          make sqlc
          # 変更だけでなく未追跡の新規生成ファイルも検知するため porcelain で判定する。
          if [ -n "$(git status --porcelain -- internal/adapter/persistence/sqlcgen/)" ]; then
            echo "::error::sqlc generated code is out of date. Run 'make sqlc' in backend/ and commit internal/adapter/persistence/sqlcgen/."
            git status --porcelain -- internal/adapter/persistence/sqlcgen/
            git diff -- internal/adapter/persistence/sqlcgen/
            exit 1
          fi

      # sqlc vet: sqlc.yaml 末尾の rules をクエリ 1 本ずつに当てる静的検査。
      # drift check（上）は「生成物がクエリと一致しているか」しか見ない。vet は
      # 「SQL としては正しいが実行すると事故る」書き方 — 例えば WHERE の無い
      # UPDATE / DELETE — を弾く。ORM を廃して生 SQL に統一した以上、ORM が
      # 暗黙に持っていた安全弁の代わりはここしかない。
      # 実 DB は要らない（sqlc/db-prepare は使っていない。理由は sqlc.yaml に記載）。
      - name: sqlc vet (dangerous SQL)
        run: make sqlc-vet

      - name: go build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/frestyle-backend ./cmd/server

      - name: Show binary size
        run: ls -lh /tmp/frestyle-backend

  # repository(adapter/persistence) 層の結合テストを、本物の PostgreSQL に対して回す。
  # docker-compose.integration.yml で postgres-integration-test を起動し、
  # -tags=integration のテストだけを実行する（単体ジョブとは独立）。
  integration:
    name: integration tests (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go mod download
        run: go mod download

      # 本物の PostgreSQL を起動し healthcheck が通るまで待つ（--wait）。
      # Docker Hub の pull は runner 上で transient に timeout することがあるためリトライする。
      - name: Start PostgreSQL (docker compose)
        run: |
          for i in 1 2 3; do
            docker compose -f docker-compose.integration.yml pull --quiet && break
            echo "image pull failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          docker compose -f docker-compose.integration.yml up -d --wait

      # -run Integration で結合テスト（命名規約: テスト名に Integration を含む）だけを回す。
      # 単体テストは test ジョブで実行済みで、TEST_DATABASE_URL を env に持つこのジョブで
      # 再実行すると env 依存の単体テストが誤検知し得るため。
      #
      # カバレッジも取る。repository(internal/adapter/persistence) のクエリは実 DB を叩いて
      # 初めて通るので、この計測がないと「結合テストで毎回検証しているコードが 0%」として
      # 総カバレッジに乗ってしまう。合算と floor 判定は coverage ジョブが行う。
      #
      # -covermode=atomic は test ジョブ（-race のため atomic）と mode を揃えるため。
      # 既定は set で、mode の違うプロファイル同士は連結できない。
      # -race は従来どおり付けない。ここは実 DB 相手の I/O 待ちが主で、並行コードの
      # データ競合検査は test ジョブが担っているため。
      - name: Run integration tests (-tags=integration)
        env:
          TEST_DATABASE_URL: postgres://frestyle:frestyle@localhost:5433/frestyle_integration?sslmode=disable
        run: go test -tags=integration -run Integration -covermode=atomic -coverprofile=coverage-integration.out ./...

      # 結合側のプロファイルを coverage ジョブへ渡す。ジョブごとに runner（ファイルシステム）が
      # 別なので、ジョブをまたぐファイルの受け渡しは artifact 経由でしかできない。
      - name: Upload integration coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          # path はジョブの working-directory ではなくワークスペース起点で解決される。
          path: backend/coverage-integration.out
          if-no-files-found: error
          retention-days: 7

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  # 単体（test ジョブ）と結合（integration ジョブ）のカバレッジを合算し、floor 判定を 1 回だけ行う。
  #
  # なぜ計測が 2 つのジョブに分かれているのか:
  #   - test ジョブ … -race（データ競合検出）付きで単体テストを回す。DB は要らない。
  #   - integration ジョブ … 本物の PostgreSQL を起動して -tags=integration のテストを回す。
  #     -race は付けない（データ競合の検査は test ジョブが担う）。
  #   前提（-race の要否 / 実 DB の要否）が違うので 1 コマンドにまとめられず、並列に走らせている。
  #   その代わり、カバレッジは 2 本のプロファイルに分かれる。
  #
  # なぜ合算が必要なのか:
  #   repository（internal/adapter/persistence）のクエリは sqlc 生成コードを実 DB に対して
  #   叩いて初めて実行される。単体側のプロファイルには 1 行も現れないので、単体だけを数えると
  #   「結合テストが毎回検証しているコードがテストされていない」ように見え、総カバレッジが
  #   実態よりかなり低く出る（2026-08-26 実測: 単体のみ 45.0% → 合算 64.0%）。
  #
  # どう合算しているのか（外部ツールは使わない）:
  #   Go の coverprofile は 1 行目が "mode: <set|count|atomic>"、以降が
  #   「<ファイル>:<開始>,<終了> <実行文数> <実行回数>」の行の集まり。
  #   mode 行を 1 本だけ残して残りを単純に連結すれば、go tool cover が読み込み時に
  #   同じ位置のブロックを見つけて実行回数を足し合わせ、1 ブロックへ畳んでくれる
  #   （golang.org/x/tools/cover ParseProfiles の挙動）。つまり「どちらかで実行されたら実行済み」
  #   の合算になる。gocovmerge のような外部ツールは要らない。条件は mode が揃っていることだけで、
  #   両ジョブとも -covermode=atomic を明示しているのはこのため。
  coverage:
    name: coverage floor (unit + integration)
    runs-on: ubuntu-latest
    needs: [test, integration]
    # needs のどちらかが失敗すると、既定ではこのジョブは実行されず skip になる。
    # skip された check は branch protection 上「成功」と同じ扱いなので、
    # 落ちているはずの PR がマージ可能に見えてしまう。always() で必ず起動し、
    # 前段の結果は下の step で自分で確かめて落とす。
    if: always()
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: 前段ジョブの結果を確認
        if: needs.test.result != 'success' || needs.integration.result != 'success'
        run: |
          echo "::error::前段ジョブが成功していないためカバレッジを合算できません (test=${{ needs.test.result }}, integration=${{ needs.integration.result }})"
          exit 1

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # go tool cover -func は「どのブロックがどの関数か」を出すためにリポジトリのソースを
      # 読む（プロファイルに入っているのはファイルパスと行範囲だけ）。読むファイルは
      # モジュール経由で解決されるため、解決が依存の有無に左右されないよう先に揃えておく。
      # setup-go のキャッシュが効くので通常は数秒で終わる。
      - name: go mod download
        run: go mod download

      # 2 本のプロファイルを backend/ 直下へ取り出す（後続の go tool cover が
      # モジュール内から相対解決できる場所に置く）。
      - name: Download unit coverage profile
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit
          path: backend

      - name: Download integration coverage profile
        uses: actions/download-artifact@v7
        with:
          name: coverage-integration
          path: backend

      # 合算した総カバレッジを PR の Checks サマリに出し、floor を下回ったら fail させる。
      #
      # COVERAGE_MIN は回帰防止のための下限。domain の定数群 / docs（生成物）/ cmd /
      # 薄い infra ラッパなど 0% のパッケージも分母に入る総計なので、個々のパッケージの
      # 水準よりは低い値になる。
      #
      # 根拠（この値をどう決めたか）: 2026-08-26 に main (16092a46) をローカルで CI と同じ手順
      # （-race 付き単体 + 専用 postgres コンテナに対する -tags=integration -run Integration）
      # で計測した実測値。単体のみ 45.4% / 結合のみ 24.7% / 合算 64.4%（macOS）。
      # このうち internal/infra/sandbox だけは言語ランタイムの有無でローカル 89.0% に対し
      # CI 74.4% と差が出るため、CI 側の値に換算し直すと合算は約 64.0%。
      # 実測 64.0% に対して 2pt ほどの余裕を見て 62 とする。テストを消す・減らす変更が
      # 引っかかる程度には高く、環境差で誤検知しない程度には低い値。
      - name: merge profiles + coverage gate
        env:
          COVERAGE_MIN: '62'
        run: |
          # mode が食い違うプロファイルは連結できない（go tool cover が読めない、
          # あるいは実行回数の意味がずれる）。どちらかの -covermode 指定が消えたら
          # 黙って壊れるのではなく、ここで理由付きで落とす。
          for f in coverage-unit.out coverage-integration.out; do
            if ! head -1 "$f" | grep -qx 'mode: atomic'; then
              echo "::error::${f} の 1 行目が 'mode: atomic' ではありません（両ジョブの -covermode=atomic を確認してください）: $(head -1 "$f")"
              exit 1
            fi
          done

          # mode 行を 1 本だけ書き、残りは両方のプロファイルをそのまま連結する。
          # 同じブロックが 2 回現れても go tool cover 側で実行回数が合算される。
          {
            echo 'mode: atomic'
            grep -h -v '^mode:' coverage-unit.out coverage-integration.out
          } > coverage-merged.out

          unit=$(go tool cover -func=coverage-unit.out | tail -1 | awk '{print $3}')
          integration=$(go tool cover -func=coverage-integration.out | tail -1 | awk '{print $3}')
          total=$(go tool cover -func=coverage-merged.out | tail -1 | awk '{print $3}')

          {
            echo "## Backend test coverage: ${total} (min ${COVERAGE_MIN}%)"
            echo ""
            echo "| 計測 | カバレッジ |"
            echo "| --- | --- |"
            echo "| 単体のみ (race) | ${unit} |"
            echo "| 結合のみ (postgres) | ${integration} |"
            echo "| **合算（判定対象）** | **${total}** |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "unit: ${unit} / integration: ${integration} / merged: ${total} (min ${COVERAGE_MIN}%)"

          num=${total%\%}
          if awk -v t="$num" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t+0 < m+0) }'; then
            echo "::error::backend coverage ${total} is below floor ${COVERAGE_MIN}%"
            exit 1
          fi

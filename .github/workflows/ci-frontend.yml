name: CI - Frontend (Vite + Vitest)

# 目的: PR / push のたびにフロントエンドのテストとビルド検証だけを行う。
# 本ワークフローは S3 / CloudFront に一切触らない。デプロイは cd-frontend.yml で別途。

# path フィルタは付けない: 必須ステータスチェック（branch protection）として使うため、
# 対象外パスの PR でも必ず report されるよう全 PR / main push で走らせる。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Vitest + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Storybook の story はブラウザモードの Vitest プロジェクト（projects.storybook）で
      # そのままテストとして走る。headless Chromium が要るのでここで入れる。
      - name: Install Playwright Chromium (Storybook tests)
        run: npx playwright install --with-deps chromium

      # TypeScript 型チェック (production code 限定 / test ファイルは tsconfig.exclude で除外済み)。
      # tsc が 1 エラーでも報告したら fail する。React / TypeScript Handbook の
      # "static type-checking before runtime" を CI で強制する。
      - name: TypeScript type-check
        run: pnpm exec tsc --noEmit

      # ESLint で 1 件でも warning があれば fail させる（将来のドリフト防止）。
      # rules は eslint.config.js で管理。
      - name: ESLint (max-warnings=0)
        run: pnpm exec eslint . --max-warnings=0

      # Vitest をカバレッジ付きで実行し、サマリを PR の Checks に表示する。
      - name: Run Vitest (coverage)
        run: |
          set -o pipefail
          pnpm exec vitest run --coverage --coverage.reporter=text-summary | tee /tmp/vitest-out.txt
          {
            echo "## Frontend test coverage"
            echo '```'
            grep -A6 "Coverage report" /tmp/vitest-out.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # story はブラウザで実行するので unit とは別ステップ。カバレッジの閾値ゲートは
      # 上の unit 実行だけで測る（story のレンダリング分が混ざると分母が変わり、
      # ゲートが緩む方向に変質する）。
      - name: Run Storybook tests (browser)
        env:
          WITH_STORYBOOK_TESTS: '1'
        run: npx vitest run --project=storybook

      - name: Build (verify only)
        # ビルドが通るかだけ確認。S3 sync / CloudFront invalidation は CD 側で実施。
        env:
          # ビルド時の VITE_* は本番値ではなくダミーで OK（型チェック・syntax確認が目的）
          VITE_API_BASE_URL: https://example.invalid
          VITE_COGNITO_DOMAIN: https://example.invalid
          VITE_CLIENT_ID: ci-dummy
          VITE_REDIRECT_URI: https://example.invalid/callback
          VITE_RESPONSE_TYPE: code
          VITE_SCOPE: openid
        run: pnpm run build

  # 未使用ファイル / 未使用依存 / 未宣言(phantom)依存を knip で検出する。
  # 必須チェック(Vitest + Build)とは独立した job にし、デッドコードの可視化に徹する。
  # 件数を使った gating はしない(数値が安定してから別途)。
  # knip 設定は frontend/knip.json(rules で files/dependencies/unlisted に集中、
  # FSD の Public API barrel の未使用 export ノイズは当面 off)。
  # 非ブロッキング化は「knip 実行 step だけ」continue-on-error にする(下記)。
  # checkout / pnpm install --frozen-lockfile の失敗は job を赤くして可視化する(握り潰さない)。本 job は
  # 必須チェックではないため、赤くなっても PR マージはブロックしない。
  knip:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          # この job は push しないため、GITHUB_TOKEN を作業ツリーに残さない
          # (後続で PR コードの pnpm install --frozen-lockfile / pnpm exec knip を走らせるため)。
          persist-credentials: false

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 検出結果を PR の Job Summary に markdown で残す。knip の exit code は
      # 「dead code 検出 = 非 0」になり得るが、それを握り潰さず保持する
      # (設定エラー・起動失敗も Summary に出力してから同じ code で終了)。
      # continue-on-error はこの step だけに付け、非 0 でも job を止めない
      # (checkout / pnpm install --frozen-lockfile の失敗は job を赤くして可視化する)。
      - name: Run knip (report only)
        continue-on-error: true
        run: |
          set +e
          pnpm exec knip --reporter markdown > /tmp/knip-report.md 2>&1
          status=$?
          {
            echo "## Frontend dead code (knip)"
            echo ""
            cat /tmp/knip-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # 本番バンドルサイズ(gzip)を size-limit で計測する。必須チェック(Vitest + Build)とは
  # 独立した job にし、サイズの可視化と回帰検知に徹する。上限(.size-limit.json)は現状 +
  # ヘッドルームで、超過はシグナルとして扱う。厳密な gating は数値が安定してから別途。
  # 非ブロッキング化は「size-limit 実行 step だけ」continue-on-error にする(下記)。
  # pnpm install --frozen-lockfile / build の失敗は job を赤くして可視化する(握り潰さない)。本 job は必須チェック
  # ではないため、赤くなっても PR マージはブロックしない。
  size-limit:
    name: Bundle size (size-limit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          # この job は push しないため GITHUB_TOKEN を作業ツリーに残さない。
          persist-credentials: false

      # pnpm は packageManager フィールドの版で入れる（端末・CI・Docker で同じ解決にする）。
      # setup-node のキャッシュ復元より前に置くこと（pnpm が無いと cache: 'pnpm' が失敗する）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # この action は run ステップではないので defaults.run.working-directory が
          # 効かない。リポジトリ直下に package.json は無いので、版を読む先を明示する。
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # size-limit は dist/assets/* の実出力を計測するため、先に本番ビルドする。
      # VITE_* はサイズ計測が目的なのでダミーで良い(コード量は本番と同じ)。
      - name: Build
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_COGNITO_DOMAIN: https://example.invalid
          VITE_CLIENT_ID: ci-dummy
          VITE_REDIRECT_URI: https://example.invalid/callback
          VITE_RESPONSE_TYPE: code
          VITE_SCOPE: openid
        run: pnpm run build

      # 計測結果を Job Summary に残す。上限超過で size-limit は非 0 を返すが、
      # continue-on-error はこの step だけに付け、非 0 でも job を止めない
      # (build / pnpm install --frozen-lockfile の失敗はこの step の前段で job を赤くする)。
      - name: Run size-limit (report only)
        continue-on-error: true
        run: |
          set +e
          pnpm exec size-limit > /tmp/size-report.txt 2>&1
          status=$?
          {
            echo "## Frontend bundle size (size-limit, gzip)"
            echo ""
            echo '```'
            cat /tmp/size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

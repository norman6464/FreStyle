name: Mutation Testing (non-blocking)

# ミューテーションテスト。カバレッジが緑でも「実際にはバグを検出しないテスト」を、
# 実装を機械的に書き換えて (>=→> 等) 炙り出し、テストの実質的な質を測る。
#
# 運用 (Zenn の定番):
#   - PR: 変更差分だけを light 実行。ジョブ単位で非ブロッキング (continue-on-error) にし、
#     セットアップ失敗も含め既存 CI を一切ブロックしない。
#   - nightly: モジュール/src 全体を実行し、レポートを artifact 保存。
#   - 閾値 (gating) は本ワークフローでは設定しない。数値が安定してから別途。
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 16 * * *' # 01:00 JST (夜間停止帯と無関係。本番には触れない)
  workflow_dispatch:

# PR を続けて push したときや手動実行が重なったとき、古い実行をキャンセルして runner を節約する。
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-mutation:
    name: Gremlins (Go mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # ジョブ全体を非ブロッキングにする (checkout/setup/install の失敗でも PR を止めない)。
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          # --diff の比較基準 (origin/main) を得るため全履歴を取得する。
          fetch-depth: 0
          # このジョブは push しないため、認証情報を作業ツリーに残さない。
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # CI で実行する外部ツールは再現性のためリリースタグに固定する (@latest は使わない)。
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      # PR: 変更差分のパッケージだけを変異させる (高速)。信頼できない base_ref は env 経由で渡す。
      - name: Gremlins (PR light — diff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          "$(go env GOPATH)/bin/gremlins" unleash --diff "origin/$BASE_REF" -o /tmp/gremlins.json

      # nightly / 手動: モジュール全体を変異させる。
      - name: Gremlins (nightly full)
        if: github.event_name != 'pull_request'
        run: '"$(go env GOPATH)/bin/gremlins" unleash ./... -o /tmp/gremlins-full.json'

      - name: Upload gremlins report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlins-report
          path: /tmp/gremlins*.json
          # レポートが無い = 実行できなかった事実をログに残す (成功に見せない)。
          if-no-files-found: warn

  frontend-mutation:
    name: Stryker (JS/TS mutation)
    # 当面 nightly / 手動のみ。PR-light は初期テスト実行が CI で失敗する問題(FRESTYLE-214)を
    # 解消してから再有効化する。gremlins(backend)は PR でも回す。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 本番 sandbox / ローカル検証と揃えた Node で走らせる (node 20 依存の初期テスト失敗を避ける)。
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # src 全体 (テスト・生成物を除く) を変異させ、レポートを artifact 保存する。
      - name: Stryker (full)
        env:
          STRYKER_FULL: '1'
        run: npx stryker run

      - name: Upload stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: frontend/reports/mutation
          if-no-files-found: warn

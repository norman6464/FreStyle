# golangci-lint v2 設定。
# 既存 CI の staticcheck / govet / govulncheck を補完し、以下を追加で強制する:
#   - errorlint     : errors.Is/As と %w ラップを強制（エラーの文脈喪失を防ぐ）
#   - bodyclose     : HTTP response body の Close 漏れ（リーク）検出
#   - gosec         : セキュリティ静的解析（誤検知は下で正当に除外）
#   - misspell      : コメント/識別子のスペルミス
#   - unconvert     : 不要な型変換
#   - nilerr        : err != nil なのに return nil する握り潰しバグの検出
#   - contextcheck  : context の伝播漏れ（親 ctx を渡すべき箇所での取り違え）検出
#   - wastedassign  : 使われないまま上書きされる代入（デッドな代入）検出
# default で errcheck / govet / ineffassign / staticcheck / unused も走る。
#
# nilerr / contextcheck の現行ヒットはいずれも意図的な設計（IDOR フォールバック /
# 後始末を別 ctx で必ず実行）で、該当箇所は理由付き nolint で明示している。
# これらは「将来の実バグ」を検出するために有効化している（FRESTYLE-217）。
#
# formatters: gofumpt（gofmt の上位互換。空行・連続宣言の整列など追加ルールを強制）。
#   `make fmt`（= golangci-lint fmt / gofumpt -w）で自動整形、CI は未整形を fail にする。

version: "2"

# 結合テスト（//go:build integration）も静的解析の対象に含める。
# Go は build tag に合致しないファイルをパッケージに含めないため、tag を指定しないと
# 結合テストは一度も解析されない（実 DB への破壊的操作やテナント境界の主張を含む場所が
# 網の外にあった）。CLI 引数ではなく設定ファイルに置くことで、ローカルの
# `golangci-lint run` と CI が常に同じ集合を見る。
run:
  build-tags:
    - integration

formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax # 生成コード(sqlcgen 等 "Code generated ... DO NOT EDIT")は整形対象外

linters:
  enable:
    - errorlint
    - bodyclose
    - gosec
    - misspell
    - unconvert
    - nilerr
    - contextcheck
    - wastedassign
  exclusions:
    rules:
      # サンドボックス(infra/sandbox)はユーザコードを意図的に exec する。
      # 引数(filename/tmpDir)は内部生成で外部入力をそのまま渡していない。G204 は
      # このファイルに限定して除外し、他箇所の危険な exec は検出を維持する。
      - path: internal/infra/sandbox/runner\.go
        linters:
          - gosec
        text: 'G204'
      # persistence の id 境界は DB が bigint(int64)、domain が uint64。**向きで扱いを分ける。**
      #
      # DB → domain（int64 → uint64）だけを除外する。読み出した値は bigint の採番
      # シーケンス由来で常に非負なので、uint64 へ広げても値は変わらない。
      # sqlc 生成コードへの段階移行で各 repository に現れるため path で括る。
      #
      # 逆向き（domain → DB / uint64 → int64）は除外しない。こちらは math.MaxInt64 を
      # 超える値が負数へ巻き戻る本物の縮小変換で、ユーザー ID を URL から uint64 として
      # 受ける経路（ナレッジ基盤の権限 API）では利用者が指定した値がそのまま届く。
      # 必ず toInt64ID(ids.go) を通すこと。この除外を 'G115' へ戻すと検出が消える。
      - path: internal/adapter/persistence/
        linters:
          - gosec
        text: 'G115: integer overflow conversion int64 -> uint64'
      # 件数・LIMIT の int → int32 は id 境界とは別件。どちらも呼び出し側が
      # リテラル（limit=5 / 各カウント 1）を渡すだけで外部入力が届かないため除外する。
      - path: internal/adapter/persistence/(user_chapter_views|user_daily_activity)_repository\.go
        linters:
          - gosec
        text: 'G115: integer overflow conversion int -> int32'
      # テストのディレクトリ権限(G301) / Cookie 属性(G124) / ダミー認証情報(G101)は
      # 検証用途であり実害がないため除外。
      - path: _test\.go
        linters:
          - gosec
      # testsupport は結合テスト専用のヘルパ(build tag integration)。既定 DSN は
      # ローカル docker の固定値で、本番の資格情報ではないため G101 のみ除外する。
      # ファイル名が _test.go ではないので上の除外に掛からない。
      - path: internal/testsupport/
        linters:
          - gosec
        text: 'G101'
      # defer Close() / os.Remove() / CLI の fmt.Fprint は慣例的に戻り値を無視する。
      - linters:
          - errcheck
        source: 'defer .*\.Close\(\)'
      - linters:
          - errcheck
        source: 'defer os\.Remove'
      - linters:
          - errcheck
        source: 'fmt\.Fprint'

# 同種・同 linter の指摘を省略せず全件報告する（CI で取りこぼさないため）。
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

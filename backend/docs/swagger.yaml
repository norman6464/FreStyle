basePath: /api/v2
definitions:
  github_com_norman6464_FreStyle_backend_internal_domain.AdminInvitation:
    properties:
      companyId:
        type: integer
      createdAt:
        type: string
      email:
        type: string
      expiresAt:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.RoleName'
      status:
        type: string
      workspaceId:
        description: |-
          WorkspaceID は所属ワークスペースへの参照。CompanyID から dual-write されるため
          通常は必ず埋まっているが、Course と同じ理由で NULL を許容する型にする。
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.AuditEvent:
    properties:
      action:
        description: 'Action は「METHOD ルートパターン」（例: "PATCH /api/v2/admin/companies/:id/active"）。'
        type: string
      actorEmail:
        type: string
      actorId:
        type: integer
      actorRole:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      targetId:
        description: TargetID は操作対象の ID（会社 ID / ユーザー ID など。取得できないときは 0）。
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.CodeExecutionResult:
    properties:
      exitCode:
        type: integer
      stderr:
        type: string
      stdout:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.Company:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      isActive:
        description: |-
          IsActive は会社アカウントの有効/無効。false（無効）にすると、その会社の全ユーザーが
          ログイン/利用不可になる（middleware で弾く）。super_admin が会社一覧から切り替える。
        type: boolean
      name:
        type: string
      updatedAt:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.Course:
    properties:
      category:
        type: string
      companyId:
        type: integer
      createdAt:
        type: string
      createdByUserId:
        type: integer
      description:
        type: string
      id:
        type: integer
      isPublished:
        type: boolean
      language:
        description: |-
          Language は主に扱う言語・技術（例: "go" / "docker" / "terraform"。空 = 言語が主題でない）。
          演習の language と同じ自由文字列方式で、表示色は frontend のカラーマップが持つ。
        type: string
      sortOrder:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
      workspaceId:
        description: |-
          WorkspaceID は所属ワークスペースへの参照。CompanyID から dual-write されるため
          通常は必ず埋まっているが、User と同じ理由で NULL を許容する型にする（FRESTYLE-402）。
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.ExerciseSubmission:
    properties:
      exerciseId:
        type: integer
      exerciseKind:
        type: string
      exitCode:
        type: integer
      id:
        type: integer
      isCorrect:
        type: boolean
      stderr:
        type: string
      stdout:
        type: string
      submittedAt:
        type: string
      submittedCode:
        type: string
      userId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.Health:
    properties:
      db:
        type: string
      status:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.MasterExercise:
    properties:
      category:
        type: string
      chapterId:
        type: integer
      createdAt:
        type: string
      description:
        type: string
      difficulty:
        type: integer
      expectedOutput:
        type: string
      explanation:
        description: Explanation は qa モードで正解後に表示する markdown 解説。
        type: string
      hintText:
        type: string
      id:
        type: integer
      isPublished:
        type: boolean
      language:
        type: string
      mode:
        description: Mode は採点モード。execute は実行して stdout 比較、qa は提出文字列と ExpectedOutput
          を trim 比較。
        type: string
      orderIndex:
        type: integer
      slug:
        type: string
      starterCode:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.MasterExerciseExample:
    properties:
      createdAt:
        type: string
      exerciseId:
        description: (exercise_id, order_index) の UNIQUE で同一問題内の OrderIndex 衝突を DB
          レベルで弾く。
        type: integer
      expectedOutput:
        type: string
      id:
        type: integer
      inputText:
        type: string
      orderIndex:
        description: DEFAULT を持たせない（default:0 だと未指定 INSERT が 0 で衝突するため）。
        type: integer
      updatedAt:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.Note:
    properties:
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      isPinned:
        type: boolean
      isPublic:
        type: boolean
      title:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.NoteImageUploadURL:
    properties:
      expiresIn:
        type: integer
      key:
        type: string
      publicUrl:
        description: |-
          PublicURL はアップロード後に img / Markdown から参照する表示用パス。
          配信ドメインは含めない（FRESTYLE-234。ドメイン変更で保存済みデータが壊れないように）。
        type: string
      url:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.Notification:
    properties:
      body:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      isRead:
        type: boolean
      title:
        type: string
      type:
        type: string
      userId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.ProfileImageUploadURL:
    properties:
      expiresIn:
        type: integer
      imageUrl:
        type: string
      key:
        type: string
      uploadUrl:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.ProfileView:
    properties:
      avatarUrl:
        type: string
      bio:
        type: string
      displayName:
        type: string
      email:
        type: string
      status:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.RoleName:
    enum:
    - super_admin
    - company_admin
    - trainee
    type: string
    x-enum-varnames:
    - RoleSuperAdmin
    - RoleCompanyAdmin
    - RoleTrainee
  github_com_norman6464_FreStyle_backend_internal_domain.TeachingMaterial:
    properties:
      companyId:
        type: integer
      courseId:
        type: integer
      createdAt:
        type: string
      createdByUserId:
        type: integer
      id:
        type: integer
      isPublished:
        type: boolean
      orderInCourse:
        type: integer
      revision:
        description: Revision は doc 更新の楽観ロック用。doc を更新するたびに +1（不一致は 409）。
        type: integer
      schemaVersion:
        description: SchemaVersion は doc のエディタスキーマ版。読込時アップキャストの目印（現行 1）。
        type: integer
      title:
        type: string
      updatedAt:
        type: string
      workspaceId:
        description: |-
          WorkspaceID は所属ワークスペースへの参照。CompanyID から dual-write されるため
          通常は必ず埋まっているが、Course と同じ理由で NULL を許容する型にする（FRESTYLE-403）。
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.UserChapterView:
    properties:
      courseId:
        type: integer
      firstViewedAt:
        type: string
      lastViewedAt:
        type: string
      teachingMaterialId:
        description: |-
          TeachingMaterialID は章(course_chapters)の ID。DB 列は chapter_id(FRESTYLE-185 で改名)。
          JSON キーは互換のため teachingMaterialId のまま。
        type: integer
      userId:
        type: integer
      viewCount:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.UserDailyActivity:
    properties:
      activityDate:
        type: string
      correctCount:
        type: integer
      exerciseCount:
        type: integer
      lessonCount:
        description: |-
          LessonCount は完了した章の数。DB 列は chapter_count(FRESTYLE-185 で改名)。
          JSON キーは互換のため lessonCount のまま。
        type: integer
      noteCount:
        type: integer
      userId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.UserLessonProgress:
    properties:
      completedAt:
        type: string
      courseId:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      teachingMaterialId:
        description: |-
          TeachingMaterialID は章(course_chapters)の ID。DB 列は chapter_id(FRESTYLE-185 で改名)。
          JSON キーは互換のため teachingMaterialId のまま。
        type: integer
      userId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_domain.UserStats:
    properties:
      averageScore:
        type: number
      longestStreak:
        type: integer
      streakDays:
        type: integer
      totalSessions:
        type: integer
      userId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_infra_embed.Card:
    properties:
      description:
        type: string
      imageUrl:
        type: string
      provider:
        description: Provider は "ogp" / "youtube" / "github" など、どの戦略で解決したかを示す。
        type: string
      siteName:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.AncestorRef:
    properties:
      id:
        type: string
      title:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.CompanyLearningSummaryOutput:
    properties:
      activeThisWeek:
        description: ActiveThisWeek は直近 7 日間(今日を含む)に学習活動があった trainee 数。
        type: integer
      activeToday:
        description: ActiveToday は今日(UTC)学習活動があった trainee 数。
        type: integer
      recentMembers:
        description: |-
          RecentMembers は最終活動日の新しい順の直近アクティブメンバー
          (直近 7 日間に活動があるメンバーのみ、最大 5 名)。
        items:
          $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_usecase.MemberLearningSummaryItem'
        type: array
      traineeCount:
        description: TraineeCount は在籍 trainee 数(論理削除済みを除く)。
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.CompanyStat:
    properties:
      activeMembers:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      isActive:
        type: boolean
      memberTotal:
        type: integer
      name:
        type: string
      traineeCount:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.CourseWithProgress:
    properties:
      category:
        type: string
      companyId:
        type: integer
      completedCount:
        description: CompletedCount は actor 自身が完了した章数(現存する published 章のみ。常に MaterialCount
          以下)。
        type: integer
      createdAt:
        type: string
      createdByUserId:
        type: integer
      description:
        type: string
      id:
        type: integer
      isPublished:
        type: boolean
      language:
        description: |-
          Language は主に扱う言語・技術（例: "go" / "docker" / "terraform"。空 = 言語が主題でない）。
          演習の language と同じ自由文字列方式で、表示色は frontend のカラーマップが持つ。
        type: string
      materialCount:
        description: MaterialCount はコース内の章数。trainee は published のみ、admin 系は下書き込み。
        type: integer
      sortOrder:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
      workspaceId:
        description: |-
          WorkspaceID は所属ワークスペースへの参照。CompanyID から dual-write されるため
          通常は必ず埋まっているが、User と同じ理由で NULL を許容する型にする（FRESTYLE-402）。
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.GetDailyStreakOutput:
    properties:
      currentStreak:
        type: integer
      longestStreak:
        type: integer
      totalAchievedDays:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.GetMasterExerciseDetailOutput:
    properties:
      examples:
        items:
          $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.MasterExerciseExample'
        type: array
      exercise:
        $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.MasterExercise'
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.GetUserDashboardOutput:
    properties:
      recentActivity:
        items:
          $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.UserDailyActivity'
        type: array
      recentChapterViews:
        items:
          $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.UserChapterView'
        type: array
      streak:
        type: integer
      totalCorrect:
        type: integer
      totalExercises:
        type: integer
      totalLessons:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.MemberLearningSummaryItem:
    properties:
      lastActiveDate:
        description: LastActiveDate は最後に学習活動があった日(YYYY-MM-DD、UTC 基準)。
        type: string
      name:
        type: string
      recentActivityCount:
        description: RecentActivityCount は直近 7 日間の活動回数合計。
        type: integer
      userId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.SubmitMasterExerciseOutput:
    properties:
      isCorrect:
        type: boolean
      results:
        items:
          $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_usecase.TestCaseResult'
        type: array
      submissionId:
        type: integer
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase.TestCaseResult:
    properties:
      actualOutput:
        type: string
      expectedOutput:
        type: string
      input:
        type: string
      orderIndex:
        type: integer
      passed:
        type: boolean
      stderr:
        type: string
    type: object
  github_com_norman6464_FreStyle_backend_internal_usecase_repository.ExerciseSubmissionStats:
    properties:
      solvedUsers:
        type: integer
      totalSubmissions:
        type: integer
    type: object
  internal_handler.chapterDetailResponse:
    properties:
      companyId:
        type: integer
      courseId:
        type: integer
      createdAt:
        type: string
      createdByUserId:
        type: integer
      doc:
        items:
          type: integer
        type: array
      id:
        type: integer
      isPublished:
        type: boolean
      orderInCourse:
        type: integer
      revision:
        description: Revision は doc 更新の楽観ロック用。doc を更新するたびに +1（不一致は 409）。
        type: integer
      schemaVersion:
        description: SchemaVersion は doc のエディタスキーマ版。読込時アップキャストの目印（現行 1）。
        type: integer
      title:
        type: string
      updatedAt:
        type: string
      workspaceId:
        description: |-
          WorkspaceID は所属ワークスペースへの参照。CompanyID から dual-write されるため
          通常は必ず埋まっているが、Course と同じ理由で NULL を許容する型にする（FRESTYLE-403）。
        type: string
    type: object
  internal_handler.codeExecuteRequest:
    properties:
      code:
        type: string
      language:
        type: string
    required:
    - code
    type: object
  internal_handler.codeWarmupRequest:
    properties:
      language:
        type: string
    required:
    - language
    type: object
  internal_handler.codeWarmupResponse:
    properties:
      ready:
        type: boolean
    type: object
  internal_handler.cognitoCallbackReq:
    properties:
      code:
        type: string
      invitationToken:
        description: InvitationToken は招待マジックリンク経由の UUID（任意）。指定時は email 検索より優先して照合する。
        type: string
    required:
    - code
    type: object
  internal_handler.courseRequest:
    properties:
      category:
        description: |-
          Category は定義済みの学習領域のみ許可(空 = 未分類)。値の正本は domain.ValidCourseCategories。
          oneof で宣言的に 400 を返し、usecase 側でも防衛的に検証する。
        enum:
        - dev-basics
        - backend
        - architecture
        - database
        - infra
        - security
        - product
        type: string
      description:
        type: string
      isPublished:
        type: boolean
      language:
        description: |-
          Language は主に扱う言語・技術(例: "go" / "docker"。空 = 言語が主題でない)。
          演習の language と同じ自由文字列方式(表示色は frontend のカラーマップが持つ)。
        maxLength: 50
        type: string
      sortOrder:
        type: integer
      title:
        type: string
    type: object
  internal_handler.createAdminInvReq:
    properties:
      companyId:
        type: integer
      email:
        type: string
      method:
        description: |-
          Method は招待方式。"magic_link"（既定・受諾リンクをメール）か
          "temporary_password"（Cognito 一時パスワードを発行し 1 度だけ返す・FRESTYLE-313）。
          未知の値は binding で 400 にする（黙ってマジックリンクにフォールバックさせない）。
        enum:
        - magic_link
        - temporary_password
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.RoleName'
    required:
    - companyId
    - email
    - role
    type: object
  internal_handler.documentCreateReq:
    properties:
      doc:
        type: object
      isPublic:
        type: boolean
      kind:
        type: string
      schemaVersion:
        type: integer
      title:
        type: string
    required:
    - doc
    - kind
    - title
    type: object
  internal_handler.documentResponse:
    properties:
      companyId:
        example: 1
        type: integer
      createdAt:
        type: string
      doc:
        type: object
      id:
        example: 31400a07-297e-8057-884b-c05dbdf9fa53
        type: string
      isPublic:
        example: false
        type: boolean
      kind:
        example: note
        type: string
      ownerId:
        example: 42
        type: integer
      revision:
        example: 1
        type: integer
      schemaVersion:
        example: 1
        type: integer
      title:
        example: 学習メモ
        type: string
      updatedAt:
        type: string
      workspaceId:
        type: string
    type: object
  internal_handler.documentSummaryResponse:
    properties:
      companyId:
        example: 1
        type: integer
      createdAt:
        type: string
      id:
        example: 31400a07-297e-8057-884b-c05dbdf9fa53
        type: string
      isPublic:
        example: false
        type: boolean
      kind:
        example: note
        type: string
      ownerId:
        example: 42
        type: integer
      revision:
        example: 1
        type: integer
      schemaVersion:
        example: 1
        type: integer
      title:
        example: 学習メモ
        type: string
      updatedAt:
        type: string
      workspaceId:
        type: string
    type: object
  internal_handler.documentUpdateReq:
    properties:
      doc:
        type: object
      isPublic:
        type: boolean
      revision:
        type: integer
      schemaVersion:
        type: integer
      title:
        type: string
    required:
    - doc
    - revision
    - title
    type: object
  internal_handler.errorResponse:
    properties:
      error:
        example: unauthorized
        type: string
    type: object
  internal_handler.exerciseLanguageSummaryResponse:
    properties:
      language:
        type: string
      solved:
        type: integer
      total:
        type: integer
    type: object
  internal_handler.exercisePageResponse:
    properties:
      hasNext:
        type: boolean
      items:
        items:
          $ref: '#/definitions/internal_handler.masterExerciseListItemResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
    type: object
  internal_handler.invitationValidateResponse:
    properties:
      companyId:
        example: 1
        type: integer
      companyName:
        example: Example Corp
        type: string
      name:
        example: 山田 太郎
        type: string
      role:
        example: trainee
        type: string
      workspaceId:
        example: 0198a000-0000-7000-8000-000000000001
        type: string
    type: object
  internal_handler.issueProfileImageReq:
    properties:
      contentType:
        type: string
      fileName:
        type: string
    type: object
  internal_handler.issueUploadURLReq:
    properties:
      contentType:
        type: string
    type: object
  internal_handler.kbCreateGroupRequest:
    properties:
      name:
        example: 開発チーム
        maxLength: 200
        type: string
    required:
    - name
    type: object
  internal_handler.kbCreatePageRequest:
    properties:
      parentId:
        description: ParentID が空文字（未指定）ならスペース直下に作る。
        example: 0198a000-0000-7000-8000-000000000003
        type: string
      title:
        example: 設計メモ
        maxLength: 200
        type: string
    required:
    - title
    type: object
  internal_handler.kbCreateSpaceRequest:
    properties:
      key:
        example: eng
        type: string
      name:
        example: 開発部
        maxLength: 200
        type: string
      visibility:
        description: |-
          Visibility は省略時 workspace（チームスペース）。private は自分だけの区画で、
          メンバーなら誰でも作れる（作れる範囲の非対称は handler が判定する）。
        enum:
        - workspace
        - private
        example: workspace
        type: string
    required:
    - name
    type: object
  internal_handler.kbCreateWorkspaceRequest:
    properties:
      name:
        example: Acme 社
        maxLength: 200
        type: string
      slug:
        example: acme
        type: string
    required:
    - name
    type: object
  internal_handler.kbGrantRoleRequest:
    properties:
      role:
        description: Role は domain.ValidGrantRoles のいずれか。既知でない値は usecase が弾く。
        example: editor
        type: string
    required:
    - role
    type: object
  internal_handler.kbIssueShareLinkRequest:
    properties:
      capability:
        description: Capability はリンク経由でできることの既定（view / edit）。
        example: view
        type: string
      expiresAt:
        description: ExpiresAt が未指定なら無期限。過去の時刻は usecase が弾く。
        type: string
      password:
        description: Password が空でなければパスワード付きにする。応答にもログにも出さない。
        type: string
    required:
    - capability
    type: object
  internal_handler.kbIssuedShareLinkResponse:
    properties:
      link:
        $ref: '#/definitions/internal_handler.kbShareLinkResponse'
      token:
        description: Token は共有 URL に載せる平文トークン。
        example: 3q2-7uMBEjRWeJq83vzMzQ
        type: string
    type: object
  internal_handler.kbMovePageRequest:
    properties:
      afterPageId:
        description: |-
          AfterPageID / BeforePageID は移動先の兄弟の中でどこに置くかを、隣のページの ID で表す。
          どちらも空なら末尾。**両方を指定することはできない。**

          並び順のキーそのものを受け取らないのは、そもそも返していないため
          （キーの整数部は兄弟の通し番号になるので、飛びから伏せた枚数が読める）。
          「先頭に置く」は「最初の兄弟の手前（beforePageId）」として表す。
        example: 0198a000-0000-7000-8000-000000000004
        type: string
      beforePageId:
        example: 0198a000-0000-7000-8000-000000000005
        type: string
      parentId:
        description: |-
          ParentID を省くと、いまと同じスペースの直下（ルート）へ移す。

          省けるようにしたのはドラッグのため。入れ子になったページを最上段へ戻すのは
          基本の操作で、これが無いと「入れることはできるが出せない」ドラッグになる。
          判断はスペースの編集権限で行う（ページの例外の層が無い段なので、そこが正しい単位）。
        example: 0198a000-0000-7000-8000-000000000003
        type: string
    type: object
  internal_handler.kbPageContentResponse:
    properties:
      builtAt:
        type: string
      doc:
        type: object
    type: object
  internal_handler.kbPageDocResponse:
    properties:
      doc:
        type: object
      page:
        $ref: '#/definitions/internal_handler.kbPageResponse'
    type: object
  internal_handler.kbPageResponse:
    properties:
      archivedAt:
        type: string
      createdAt:
        type: string
      createdByUserId:
        example: 42
        type: integer
      id:
        example: 0198a000-0000-7000-8000-000000000003
        type: string
      parentId:
        type: string
      spaceId:
        example: 0198a000-0000-7000-8000-000000000002
        type: string
      title:
        example: 設計メモ
        type: string
      updatedAt:
        type: string
    type: object
  internal_handler.kbPageRestrictionResponse:
    properties:
      capability:
        example: view
        type: string
      createdAt:
        type: string
      mode:
        example: deny
        type: string
      pageId:
        example: 0198a000-0000-7000-8000-000000000003
        type: string
      principalId:
        example: 0198a000-0000-7000-8000-00000000000a
        type: string
      updatedAt:
        type: string
    type: object
  internal_handler.kbPageTreeResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/internal_handler.kbPageTreeResponse'
        type: array
      hasHiddenChildren:
        description: |-
          HasHiddenChildren はこのページの直下に、閲覧できないページが在るか。
          枚数も題名も出さない。理由は ListViewablePagesOutput の doc に書いてある。
        example: false
        type: boolean
      page:
        $ref: '#/definitions/internal_handler.kbPageResponse'
      parentArchived:
        description: |-
          ParentArchived は親がアーカイブ済みか。アーカイブ済みの一覧でだけ意味を持つ
          （現役の一覧では常に false）。**事実であって判断ではない** — 復帰できるかの規則は
          「親がアーカイブ中なら断る」で、それを持つのは UnarchivePageUseCase。
        example: false
        type: boolean
    type: object
  internal_handler.kbPageTreeRootResponse:
    properties:
      hasHiddenChildren:
        description: |-
          HasHiddenChildren はスペース直下に、閲覧できないページが在るか。
          1 件も見えないスペースでは必ず false（存在しないスペースと撃ち分けないため）。
        example: false
        type: boolean
      pages:
        items:
          $ref: '#/definitions/internal_handler.kbPageTreeResponse'
        type: array
    type: object
  internal_handler.kbPrincipalResponse:
    properties:
      createdAt:
        type: string
      id:
        example: 0198a000-0000-7000-8000-00000000000a
        type: string
      kind:
        example: user
        type: string
      name:
        description: Name は kind=group のときだけ入る。
        example: 開発チーム
        type: string
      spaceId:
        description: SpaceID は kind=space_all のときだけ入る。
        type: string
      userId:
        description: UserID は kind=user のときだけ入る。
        example: 42
        type: integer
    type: object
  internal_handler.kbRenamePageRequest:
    properties:
      title:
        example: 設計メモ (改訂)
        maxLength: 200
        type: string
    required:
    - title
    type: object
  internal_handler.kbRenameSpaceRequest:
    properties:
      name:
        example: 開発部 (改組)
        maxLength: 200
        type: string
    required:
    - name
    type: object
  internal_handler.kbReplaceContentRequest:
    properties:
      doc:
        type: object
    required:
    - doc
    type: object
  internal_handler.kbResolvedPageResponse:
    properties:
      ancestors:
        items:
          $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_usecase.AncestorRef'
        type: array
      canEdit:
        type: boolean
      doc:
        type: object
      page:
        $ref: '#/definitions/internal_handler.kbPageResponse'
      workspaceName:
        example: 開発チーム
        type: string
      workspaceSlug:
        example: w-3f2a9c
        type: string
    type: object
  internal_handler.kbSetRestrictionRequest:
    properties:
      mode:
        description: Mode は allow（限定公開の許可リストへ載せる）か deny（この主体だけ外す）。
        example: deny
        type: string
    required:
    - mode
    type: object
  internal_handler.kbShareLinkResponse:
    properties:
      capability:
        description: Capability はリンク経由でできることの既定（view / edit）。
        example: view
        type: string
      createdAt:
        type: string
      createdByUserId:
        example: 42
        type: integer
      expiresAt:
        type: string
      id:
        example: 0198a000-0000-7000-8000-00000000000c
        type: string
      pageId:
        example: 0198a000-0000-7000-8000-000000000003
        type: string
      requiresPassword:
        description: RequiresPassword はパスワード付きのリンクか。
        example: false
        type: boolean
      revokedAt:
        type: string
    type: object
  internal_handler.kbSpaceGrantResponse:
    properties:
      createdAt:
        type: string
      principalId:
        example: 0198a000-0000-7000-8000-00000000000a
        type: string
      role:
        example: editor
        type: string
      spaceId:
        example: 0198a000-0000-7000-8000-000000000002
        type: string
      updatedAt:
        type: string
    type: object
  internal_handler.kbSpaceResponse:
    properties:
      createdAt:
        type: string
      id:
        example: 0198a000-0000-7000-8000-000000000002
        type: string
      key:
        example: eng
        type: string
      name:
        example: 開発部
        type: string
      visibility:
        description: Visibility はサイドバーの節分けに使う（workspace = チーム / private = プライベート）。
        example: workspace
        type: string
    type: object
  internal_handler.kbVerifiedShareLinkResponse:
    properties:
      capability:
        example: view
        type: string
      expiresAt:
        type: string
      pageId:
        example: 0198a000-0000-7000-8000-000000000003
        type: string
    type: object
  internal_handler.kbVerifyShareLinkRequest:
    properties:
      password:
        description: Password はパスワード付きリンクのときに要る。
        type: string
      token:
        type: string
    required:
    - token
    type: object
  internal_handler.kbWorkspaceGrantResponse:
    properties:
      createdAt:
        type: string
      principalId:
        example: 0198a000-0000-7000-8000-00000000000a
        type: string
      role:
        example: editor
        type: string
      updatedAt:
        type: string
    type: object
  internal_handler.kbWorkspaceResponse:
    properties:
      canManage:
        description: |-
          CanManage は自分がこのワークスペースの admin か（削除操作を出してよいかの判定に使う。
          DeleteWorkspace が要求する権限と同じ）。
        type: boolean
      createdAt:
        type: string
      name:
        example: Acme 社
        type: string
      slug:
        example: acme
        type: string
    type: object
  internal_handler.markLessonCompleteRequest:
    properties:
      teachingMaterialId:
        type: integer
    required:
    - teachingMaterialId
    type: object
  internal_handler.masterExerciseListItemResponse:
    properties:
      category:
        type: string
      difficulty:
        type: integer
      id:
        type: integer
      isPublished:
        type: boolean
      language:
        type: string
      mode:
        type: string
      orderIndex:
        type: integer
      slug:
        type: string
      stats:
        $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_usecase_repository.ExerciseSubmissionStats'
      status:
        description: Status は current user の提出状況。"solved" / "in_progress" / ""（未提出）。
        type: string
      title:
        type: string
    type: object
  internal_handler.meResponse:
    properties:
      companyId:
        example: 1
        type: integer
      createdAt:
        type: string
      email:
        example: user@example.com
        type: string
      groups:
        example:
        - admin
        items:
          type: string
        type: array
      id:
        example: 42
        type: integer
      isAdmin:
        example: false
        type: boolean
      name:
        example: 山田 太郎
        type: string
      role:
        example: trainee
        type: string
      updatedAt:
        type: string
      workspaceId:
        example: 0198a000-0000-7000-8000-000000000001
        type: string
    type: object
  internal_handler.memberResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      isActive:
        description: IsActive はアカウントの有効/無効。false = 無効（ログイン/利用不可）。
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.RoleName'
    type: object
  internal_handler.messageResponse:
    properties:
      message:
        example: ログインしました。
        type: string
    type: object
  internal_handler.newPasswordReq:
    properties:
      email:
        format: email
        type: string
      newPassword:
        type: string
      session:
        type: string
    required:
    - email
    - newPassword
    - session
    type: object
  internal_handler.noteCreateReq:
    properties:
      content:
        type: string
      isPinned:
        type: boolean
      isPublic:
        type: boolean
      title:
        type: string
    required:
    - title
    type: object
  internal_handler.noteUpdateReq:
    properties:
      content:
        type: string
      isPinned:
        type: boolean
      isPublic:
        type: boolean
      title:
        type: string
    required:
    - title
    type: object
  internal_handler.passwordLoginReq:
    properties:
      email:
        format: email
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_handler.setCompanyActiveRequest:
    properties:
      active:
        type: boolean
    required:
    - active
    type: object
  internal_handler.setMemberActiveRequest:
    properties:
      active:
        type: boolean
    required:
    - active
    type: object
  internal_handler.submitExerciseRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  internal_handler.teachingMaterialCreateRequest:
    properties:
      courseId:
        type: integer
      isPublished:
        type: boolean
      orderInCourse:
        type: integer
      title:
        type: string
    required:
    - courseId
    type: object
  internal_handler.teachingMaterialUpdateRequest:
    properties:
      isPublished:
        type: boolean
      orderInCourse:
        type: integer
      title:
        type: string
    type: object
  internal_handler.updateChapterDocRequest:
    properties:
      doc:
        items:
          type: integer
        type: array
      expectedRevision:
        minimum: 1
        type: integer
    required:
    - doc
    - expectedRevision
    type: object
  internal_handler.updateProfileReq:
    properties:
      avatarUrl:
        type: string
      bio:
        type: string
      displayName:
        description: |-
          Name はフロントの送信キー displayName で受ける (name では常に空になり
          users.UpdateName が呼ばれず氏名が保存されない: FRESTYLE-198)。
        type: string
      iconUrl:
        description: 旧フロント互換。avatarUrl を優先。
        type: string
      status:
        type: string
    type: object
info:
  contact:
    name: FreStyle Engineering
    url: https://frestyle.jp
  description: |-
    新卒 IT エンジニア 向け 統合 研修 プラットフォーム の REST API。
    Clean Architecture (port = usecase/repository / adapter = adapter/persistence) で 構築。
  termsOfService: https://frestyle.jp/terms
  title: FreStyle Backend API
  version: "2.0"
paths:
  /admin/audit-events:
    get:
      description: 管理者の重要操作（会社の有効/無効・従業員の停止/削除・招待など）の監査記録を新しい順で最大 200 件返す。super_admin
        専用。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.AuditEvent'
            type: array
        "401":
          description: 未認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: super_admin 以外
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: DB 失敗
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - CookieAuth: []
      summary: 監査ログ一覧（super_admin）
      tags:
      - admin
  /admin/companies:
    get:
      description: 全 company を 返す。 super_admin 専用。 顧客 企業 の 一覧 な ので 他 role に は 出さ ない。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.Company'
            type: array
        "401":
          description: 未 認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: super_admin 以外
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: DB 失敗
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - CookieAuth: []
      summary: 会社 一覧 (SuperAdmin)
      tags:
      - admin
  /admin/companies/{id}/active:
    patch:
      consumes:
      - application/json
      description: 会社を無効化すると、その会社の全ユーザーがログイン/利用不可になる（middleware で弾く）。super_admin のみ。
      parameters:
      - description: 会社 ID
        in: path
        name: id
        required: true
        type: integer
      - description: active=false で無効化
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.setCompanyActiveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.messageResponse'
        "400":
          description: 不正な ID / body
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: 未認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: super_admin 以外
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: 会社が存在しない
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: 更新失敗
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - CookieAuth: []
      summary: 会社アカウントの有効/無効を切り替え（super_admin 専用）
      tags:
      - admin
  /admin/companies/stats:
    get:
      description: 全 company に、各社の在籍メンバー数（総数 / 有効 / trainee）を付けて返す。super_admin 専用画面用。認可は
        middleware で別途担保。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_usecase.CompanyStat'
            type: array
        "401":
          description: 未認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: super_admin 以外
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: DB 失敗
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - CookieAuth: []
      summary: 会社横断ビュー（メンバー集計・super_admin）
      tags:
      - admin
  /admin/invitations:
    get:
      description: pending な 招待 を 返す。 SuperAdmin は 全社 (?companyId= で 絞り込み 可)、 CompanyAdmin
        は 自社 のみ。 trainee 等 は 403。
      parameters:
      - description: 'SuperAdmin の とき のみ 有効: 特定 company の 招待 のみ'
        in: query
        name: companyId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.AdminInvitation'
            type: array
        "400":
          description: ListByCompanyID 失敗 (現状 実装 で 400 を 返す パス あり)
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: 未 認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: trainee / company 未 設定 等
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: DB 失敗 (ListAll 経路)
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - CookieAuth: []
      summary: 招待 一覧 (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: '招待を作成する。method=magic_link（既定）は受諾リンクをメール送信、method=temporary_password
        は Cognito 一時パスワードを発行してレスポンスで 1 度だけ返す。SoD: SuperAdmin は company_admin のみ 招待
        可、 CompanyAdmin は trainee のみ 自社 に 招待 可。'
      parameters:
      - description: 招待 内容 (CompanyAdmin は companyId が 上書き さ れる)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createAdminInvReq'
      produces:
      - application/json
      responses:
        "201":
          description: magic_link 方式は招待行。temporary_password 方式は {invitation, temporaryPassword}
            を返し temporaryPassword は 1 度だけ提示される
          schema:
            $ref: '#/definitions/github_com_norman6464_FreStyle_backend_internal_domain.AdminInvitation'
        "400":
          description: バリデーション / 未知の method / 一時パスワード方式が未構成
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: 未 認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: ロール 違反
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "409":
          description: 一時パスワード方式で対象 email が既に存在
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - CookieAuth: []
      summary: 招待 作成
      tags:
      - admin
  /admin/invitations/{id}:
    delete:
      description: |-
        指定 招待 の status を canceled に 更新。 行 は 物理 削除 せず 監査 用 に 残す。
        super_admin は 全社、 company_admin は 自社 の 招待 のみ 取消 できる。
      parameters:
      - description: 招待 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 成功 (本文 なし)
        "400":
          description: 不正 な ID / DB 失敗
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: 未 認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: 管理者 以外
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: 招待 が 存在 し ない (他社 の 招待 を 含む)
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - CookieAuth: []
      summary: 招待 取り消し
      tags:
      - admin
  /admin/members:
    get:
      description: 自社（company_admin の所属会社）の従業員一覧を返す。company_admin / super_admin のみ。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.memberResponse'
            type: array
        "401":
          description: 未認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: 管理者以外
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: 内部エラー
          schema:

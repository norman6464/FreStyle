        の は ワークスペース の admin だけ で、 権限 が 無い 場合 と 対象 が 存在 し ない 場合 は 同じ 404。 ユーザー の admin
        が 1 人 も 残ら なく なる とき は 409 で 断る (誰 も 権限 を 変え られ ない ワークスペース は API から 復旧 でき ない
        ため)。
      parameters:
      - description: ワークスペース の slug
        in: path
        name: workspaceSlug
        required: true
        type: string
      - description: 主体 ID (UUID)
        in: path
        name: principalId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 取り消し 済み
        "401":
          description: 未 認証
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: 権限 が 無い か 対象 が 無い
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "409":
          description: 最後 の admin を 外す 操作
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: DB 失敗
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - CookieAuth: []
      summary: ノート の ワークスペース 権限 取り消し
      tags:
      - knowledge-base
    put:
      consumes:
      - application/json

        "400":
          description: 入力 不正 (email 形式 / password 欠落)
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: 資格 情報 誤り
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: 最初の運営管理者作成の競合負け
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "409":
          description: 同じ email での同時サインアップ競合
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "429":
          description: レート制限超過

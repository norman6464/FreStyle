<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content-Security-Policy:
        - default-src 'self'                            : 既定で同一オリジン以外を遮断
        - script-src 'self'                             : インラインスクリプト禁止（Self-XSS / 注入対策）
        - style-src 'self' 'unsafe-inline'              : Tailwind / React の inline style 用
        - img-src 'self' data: https: blob:               : avatar / 署名付き URL の画像 / data URL /
                                                           URL.createObjectURL() プレビュー（添付チップ）
        - font-src 'self' data:                         : ローカルフォント + base64 埋め込み
        - connect-src 'self' https://api.frestyle.dev
                       https://identitytoolkit.googleapis.com https://securetoken.googleapis.com
                       https://storage.googleapis.com   : 自前 API / GCIP（Firebase Auth JS SDK が
                                                           サインイン・トークン更新で叩く 2 つの
                                                           Google API）/ Cloud Storage の署名付き URL
        - frame-src https://frestyle-507912.firebaseapp.com
                                                         : Google サインイン（signInWithPopup）が
                                                           authDomain 上の /__/auth/iframe を埋め込む。
                                                           default-src 'self' のままだと popup を開いても
                                                           結果が親ページへ返らない
        - form-action 'self'                            : フォームの送信先を自分自身に限る
        - base-uri 'self'                               : <base> 注入対策
        - object-src 'none'                             : <object>/<embed>/<applet> 禁止
        - upgrade-insecure-requests                     : http リソース参照を https に強制

      NOTE: `frame-ancestors` は CSP 仕様で <meta> 経由では無視される（HTTP ヘッダー専用）。
      Clickjacking の防御は Firebase Hosting のヘッダー設定（リポジトリ直下の firebase.json）で
      `X-Frame-Options: DENY` を配信して等価に行う。`report-uri` / `report-to` / `sandbox` も
      同様に meta では無視されるので、配信が必要な場合は firebase.json 側に追加する。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.frestyle.dev https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://storage.googleapis.com; frame-src https://frestyle-507912.firebaseapp.com; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      SEO:
        - OGP / Twitter Card は SNS・チャットでの共有時のプレビュー用。
        - JSON-LD (Organization + WebSite) は構造化データ。type="application/ld+json" の
          データブロックは実行されないため CSP script-src 'self' の対象外（ブロックされない）。

      説明文（meta description / og:description / JSON-LD の description）は**意図的に
      置いていない**。以前の説明は撤去済みの機能を挙げており実態と合わなくなった。
      合わない説明を置くくらいなら無い方がよいという判断で、位置づけが決まるまで空にする。
      description が無いと Google は描画後の本文から抽出するため、置くと決めたらここに書く。
    -->
    <title>FreStyle</title>
    <link rel="canonical" href="https://frestyle.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreStyle" />
    <meta property="og:title" content="FreStyle" />
    <meta property="og:url" content="https://frestyle.dev/" />
    <meta property="og:image" content="https://frestyle.dev/ogp.png" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://frestyle.dev/#organization",
            "name": "FreStyle",
            "url": "https://frestyle.dev/",
            "logo": "https://frestyle.dev/ogp.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://frestyle.dev/#website",
            "url": "https://frestyle.dev/",
            "name": "FreStyle",
            "inLanguage": "ja",
            "publisher": { "@id": "https://frestyle.dev/#organization" }
          }
        ]
      }
    </script>
    <!-- theme 初期化は public/theme-init.js に外出し（CSP: script-src 'self' を満たすため） -->
    <script src="/theme-init.js"></script>
  </head>
  <body style="background-color: var(--color-surface, #1A1A1A);">
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
